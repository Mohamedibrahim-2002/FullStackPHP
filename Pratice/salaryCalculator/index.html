<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salary Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js"></script>
  </head>
  <body>
    <h1 class="heading">Salary Calculator</h1>
    <div class="container">
      <form action="">
        <label for="salary : ">
          Enter Your Salary : <input type="text" id="Salary" />
        </label>
        <input type="button" value="Calculate" id="calc" onclick="calcSalary()" />
      </form>
      <h3 id="disBasicPay"></h3>
      <table>
       <tr>
         <th>Allowance</th>
         <th>Percentage</th>
         <th>Amount</th>
       </tr>
       <tr>
        <td>Dearness Allowance (DA)</td>
        <td>63%</td>
        <td id="disDA"></td>
       </tr>
       <tr>
        <td>House Rent Allowance (HRA)</td>
        <td>27%</td>
        <td id="disHRA"></td>
       </tr>
       <tr class="totalRow">
        <td colspan="2">Total</td>
        <td id="allowanceTotal"></td>
       </tr>
       </table>
       <table>
        <tr>
         <th>Deduction</th>
         <th>Percentage</th>
         <th>Amount</th>
       </tr>
       <tr>
        <td>Provident Fund (PF)</td>
        <td>12%</td>
        <td id="disPF"></td>
       </tr>
       <tr>
        <td>Employees' State Insurance (ESI)</td>
        <td>0.75%</td>
        <td id="disESI"></td>
       </tr>
       <tr class="totalRow">
        <td colspan="2">Total</td>
        <td id="deductionTotal"></td>
       </tr>
      </table>
      <table>
        <tr>
          <th>Salary</th>
          <th>Amount</th>
        </tr>
         <tr>
        <td>Gross Salary</td>
        <td id="disGrosspay"></td>
       </tr>
       <tr>
        <td>Net Salary</td>
         <td id="disNetpay"></td>
       </tr>
      </table>
      <!-- <h4 id="disNetpay"></h4>
      <h4 id="disNetpay"></h4> -->
    </div>
  </body>
</hml>
