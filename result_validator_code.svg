<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Outer Gradient Background -->
  <rect width="760" height="460" rx="20" fill="url(#bgGrad2)"/>
  <rect width="760" height="460" rx="20" fill="url(#cardGrad2)"/>

  <!-- Code Window -->
  <g filter="url(#shadow2)">
    <rect x="40" y="35" width="680" height="390" rx="14" fill="#1e1e2e" stroke="#313244" stroke-width="1.5"/>

    <!-- Title Bar -->
    <rect x="40" y="35" width="680" height="44" rx="14" fill="#11111b"/>
    <rect x="40" y="65" width="680" height="14" fill="#11111b"/>
    <line x1="40" y1="79" x2="720" y2="79" stroke="#313244" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="65" cy="57" r="6" fill="#f38ba8"/>
    <circle cx="85" cy="57" r="6" fill="#f9e2af"/>
    <circle cx="105" cy="57" r="6" fill="#a6e3a1"/>

    <!-- Window Title -->
    <text x="380" y="62" text-anchor="middle" fill="#9399b2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">passOrFail / script.js</text>
    <text x="690" y="62" text-anchor="end" fill="#585b70" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="500">JavaScript</text>

    <!-- Code Content -->
    <g font-family="Consolas, 'Fira Code', 'Courier New', monospace" font-size="13.5" font-weight="500" letter-spacing="0.2">
      <text x="65" y="115">
        <tspan fill="#cba6f7">function</tspan> <tspan fill="#89b4fa">result</tspan>() {
      </text>

      <text x="90" y="140">
        <tspan fill="#cba6f7">var</tspan> <tspan fill="#cdd6f4">submark</tspan> = <tspan fill="#89b4fa">parseInt</tspan>(document.<tspan fill="#89b4fa">getElementById</tspan>(<tspan fill="#a6e3a1">"sub"</tspan>).value);
      </text>

      <text x="90" y="175">
        <tspan fill="#6c7086">// 🛡️ Defensive Input Validation &amp; Range Clamping</tspan>
      </text>

      <text x="90" y="200">
        <tspan fill="#cba6f7">if</tspan> (<tspan fill="#89b4fa">isNaN</tspan>(<tspan fill="#cdd6f4">submark</tspan>)) {
      </text>
      <text x="120" y="225">
        <tspan fill="#89b4fa">alert</tspan>(<tspan fill="#a6e3a1">"Enter a Number"</tspan>);
      </text>

      <text x="90" y="255">
        } <tspan fill="#cba6f7">else if</tspan> (<tspan fill="#cdd6f4">submark</tspan> &lt; <tspan fill="#fab387">0</tspan> || <tspan fill="#cdd6f4">submark</tspan> &gt; <tspan fill="#fab387">100</tspan>) {
      </text>
      <text x="120" y="280">
        <tspan fill="#89b4fa">alert</tspan>(<tspan fill="#a6e3a1">"Enter a Valid number between 0 to 100"</tspan>);
      </text>

      <text x="90" y="310">
        } <tspan fill="#cba6f7">else if</tspan> (<tspan fill="#cdd6f4">submark</tspan> &lt; <tspan fill="#fab387">35</tspan>) {
      </text>
      <text x="120" y="335">
        document.<tspan fill="#89b4fa">getElementById</tspan>(<tspan fill="#a6e3a1">"res"</tspan>).value = <tspan fill="#a6e3a1">"Fail"</tspan>;
      </text>

      <text x="90" y="365">
        } <tspan fill="#cba6f7">else</tspan> {
      </text>
      <text x="120" y="390">
        document.<tspan fill="#89b4fa">getElementById</tspan>(<tspan fill="#a6e3a1">"res"</tspan>).value = <tspan fill="#a6e3a1">"Pass"</tspan>;
      </text>

      <text x="65" y="415">
        }
      </text>
    </g>
  </g>
</svg>

