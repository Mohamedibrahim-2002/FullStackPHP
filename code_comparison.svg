<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 580" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1020" height="580" rx="20" fill="url(#mainBg)"/>

  <!-- Top Banner -->
  <g transform="translate(40, 30)">
    <rect width="120" height="24" rx="12" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.3"/>
    <text x="60" y="16" text-anchor="middle" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">REFACTOR DAY</text>
    <text x="135" y="18" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">JavaScript Refactor: Before vs After ⚡</text>
  </g>

  <!-- Left Column: Yesterday (Before) -->
  <g transform="translate(40, 75)" filter="url(#cardShadow)">
    <rect width="455" height="465" rx="14" fill="#181825" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Window Bar -->
    <rect width="455" height="42" rx="14" fill="#11111b"/>
    <rect y="30" width="455" height="12" fill="#11111b"/>
    <line x1="0" y1="42" x2="455" y2="42" stroke="#313244" stroke-width="1"/>

    <circle cx="25" cy="21" r="5" fill="#f43f5e"/>
    <circle cx="42" cy="21" r="5" fill="#fbbf24"/>
    <circle cx="59" cy="21" r="5" fill="#4ade80"/>

    <rect x="330" y="10" width="105" height="22" rx="6" fill="#f43f5e" fill-opacity="0.15"/>
    <text x="382" y="25" text-anchor="middle" fill="#fb7185" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">❌ YESTERDAY</text>

    <!-- Code Block (All base text in bright white #ffffff) -->
    <g font-family="Consolas, 'Fira Code', monospace" font-size="12" font-weight="500" fill="#ffffff">
      <text x="25" y="70" fill="#94a3b8">// Nested if/else with redundant math</text>
      <text x="25" y="95"><tspan fill="#cba6f7">if</tspan> (unit &lt;= <tspan fill="#fab387">200</tspan>) {</text>
      <text x="45" y="118">amt = <tspan fill="#fab387">0</tspan>;</text>
      <text x="25" y="141">} <tspan fill="#cba6f7">else if</tspan> (unit &lt;= <tspan fill="#fab387">400</tspan>) {</text>
      <text x="45" y="164">amt = (unit - <tspan fill="#fab387">200</tspan>) * <tspan fill="#fab387">4.7</tspan>;</text>
      <text x="25" y="187">} <tspan fill="#cba6f7">else if</tspan> (unit &lt;= <tspan fill="#fab387">500</tspan>) {</text>
      <text x="45" y="210"><tspan fill="#cba6f7">let</tspan> temp1 = unit - <tspan fill="#fab387">400</tspan>;</text>
      <text x="45" y="233">amt = temp1 * <tspan fill="#fab387">6.3</tspan> + <tspan fill="#fab387">200</tspan> * <tspan fill="#fab387">4.7</tspan>;</text>
      <text x="25" y="256">} <tspan fill="#cba6f7">else if</tspan> (unit &lt;= <tspan fill="#fab387">600</tspan>) {</text>
      <text x="45" y="279"><tspan fill="#cba6f7">let</tspan> temp1 = unit - <tspan fill="#fab387">500</tspan>;</text>
      <text x="45" y="302">amt = <tspan fill="#fab387">300</tspan> * <tspan fill="#fab387">4.7</tspan> + temp1 * <tspan fill="#fab387">8.4</tspan> + <tspan fill="#fab387">100</tspan> * <tspan fill="#fab387">6.3</tspan>;</text>
      <text x="25" y="325">}</text>
      <text x="25" y="355" fill="#f43f5e">// ⚠️ 50+ lines of clutter</text>
      <text x="25" y="380" fill="#e2e8f0">// ⚠️ Repeated math recalculated every run</text>
      <text x="25" y="405" fill="#e2e8f0">// ⚠️ UI &amp; calculation tangled together</text>
      <text x="25" y="430" fill="#e2e8f0">// ⚠️ Temporary variables (temp1, temp2)</text>
    </g>
  </g>

  <!-- Right Column: Today (After) -->
  <g transform="translate(525, 75)" filter="url(#cardShadow)">
    <rect width="455" height="465" rx="14" fill="#181825" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Window Bar -->
    <rect width="455" height="42" rx="14" fill="#11111b"/>
    <rect y="30" width="455" height="12" fill="#11111b"/>
    <line x1="0" y1="42" x2="455" y2="42" stroke="#313244" stroke-width="1"/>

    <circle cx="25" cy="21" r="5" fill="#f43f5e"/>
    <circle cx="42" cy="21" r="5" fill="#fbbf24"/>
    <circle cx="59" cy="21" r="5" fill="#4ade80"/>

    <rect x="345" y="10" width="90" height="22" rx="6" fill="#10b981" fill-opacity="0.15"/>
    <text x="390" y="25" text-anchor="middle" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">✅ TODAY</text>

    <!-- Code Block (All base text in bright white #ffffff) -->
    <g font-family="Consolas, 'Fira Code', monospace" font-size="12" font-weight="500" fill="#ffffff">
      <text x="25" y="70" fill="#94a3b8">// Pure function + Early returns</text>
      <text x="25" y="95"><tspan fill="#cba6f7">function</tspan> <tspan fill="#38bdf8">calculateEBBills</tspan>(units) {</text>
      
      <text x="45" y="125"><tspan fill="#cba6f7">if</tspan> (units &lt;= <tspan fill="#fab387">200</tspan>) <tspan fill="#f43f5e">return</tspan> <tspan fill="#fab387">0</tspan>;</text>
      <text x="45" y="150"><tspan fill="#cba6f7">if</tspan> (units &lt;= <tspan fill="#fab387">400</tspan>) <tspan fill="#f43f5e">return</tspan> (units - <tspan fill="#fab387">200</tspan>) * <tspan fill="#fab387">4.7</tspan>;</text>
      <text x="45" y="175"><tspan fill="#cba6f7">if</tspan> (units &lt;= <tspan fill="#fab387">500</tspan>) <tspan fill="#f43f5e">return</tspan> <tspan fill="#fab387">940</tspan> + (units - <tspan fill="#fab387">400</tspan>) * <tspan fill="#fab387">6.3</tspan>;</text>
      
      <text x="45" y="205" fill="#94a3b8">// Slabs &gt; 500 (Precomputed base rates)</text>
      <text x="45" y="230"><tspan fill="#cba6f7">if</tspan> (units &lt;= <tspan fill="#fab387">600</tspan>) <tspan fill="#f43f5e">return</tspan> <tspan fill="#fab387">2040</tspan> + (units - <tspan fill="#fab387">500</tspan>) * <tspan fill="#fab387">8.4</tspan>;</text>
      <text x="45" y="255"><tspan fill="#cba6f7">if</tspan> (units &lt;= <tspan fill="#fab387">800</tspan>) <tspan fill="#f43f5e">return</tspan> <tspan fill="#fab387">2880</tspan> + (units - <tspan fill="#fab387">600</tspan>) * <tspan fill="#fab387">9.45</tspan>;</text>
      <text x="45" y="280"><tspan fill="#cba6f7">if</tspan> (units &lt;= <tspan fill="#fab387">1000</tspan>) <tspan fill="#f43f5e">return</tspan> <tspan fill="#fab387">4770</tspan> + (units - <tspan fill="#fab387">800</tspan>) * <tspan fill="#fab387">10.5</tspan>;</text>
      
      <text x="45" y="310"><tspan fill="#f43f5e">return</tspan> <tspan fill="#fab387">6870</tspan> + (units - <tspan fill="#fab387">1000</tspan>) * <tspan fill="#fab387">11.55</tspan>;</text>
      <text x="25" y="335">}</text>

      <text x="25" y="365" fill="#34d399">// ✨ 12 clean lines total</text>
      <text x="25" y="390" fill="#e2e8f0">// ✨ Guard clauses replace nested else-if</text>
      <text x="25" y="415" fill="#e2e8f0">// ✨ Precomputed base constants</text>
      <text x="25" y="440" fill="#e2e8f0">// ✨ UI decoupled into separate handler</text>
    </g>
  </g>
</svg>
